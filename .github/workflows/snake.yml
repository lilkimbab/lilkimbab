name: snake

on:
  schedule:
    - cron: "0 15 * * *" # 매일 자정(KST)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0b0d&color_dots=#ebedf0,#d0d7de,#afb8c1,#6e7781,#424a53
            dist/snake-dark.svg?color_snake=#c6f24e&color_dots=#161b22,#2d333b,#545d68,#8b949e,#c9d1d9

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
