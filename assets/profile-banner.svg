<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jun Park — Systems, Vision, Robotics</title>
  <desc id="desc">A navy and mint banner for a UNIST computer science undergraduate, with an abstract spatial graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/><stop offset="1" stop-color="#142638"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a6c0d7" opacity=".12"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1090" cy="156" r="242" fill="none" stroke="#6ee7b7" opacity=".07"/>
    <circle cx="1090" cy="156" r="178" fill="none" stroke="#7dd3fc" opacity=".09"/>
    <path d="M0 319H1200" stroke="url(#line)" stroke-width="3"/>
    <rect x="56" y="52" width="28" height="3" rx="1.5" fill="#6ee7b7"/>
    <text x="96" y="59" fill="#a8bbcc" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" letter-spacing="2">UNIST / COMPUTER SCIENCE &amp; ENGINEERING</text>
    <text x="53" y="139" fill="#f1f5f9" font-family="DejaVu Sans,Arial,sans-serif" font-size="61" font-weight="700" letter-spacing="1">JUN PARK</text>
    <text x="57" y="182" fill="#9fb4c9" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">Building foundations. Exploring intelligent systems.</text>
    <g font-family="DejaVu Sans,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">
      <rect x="56" y="223" width="120" height="31" rx="15.5" fill="#6ee7b7" fill-opacity=".08" stroke="#6ee7b7" stroke-opacity=".28"/>
      <text x="116" y="243" text-anchor="middle" fill="#9ae6c4">SYSTEMS</text>
      <rect x="188" y="223" width="110" height="31" rx="15.5" fill="#7dd3fc" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".28"/>
      <text x="243" y="243" text-anchor="middle" fill="#a5dcf7">VISION</text>
      <rect x="310" y="223" width="132" height="31" rx="15.5" fill="#6ee7b7" fill-opacity=".08" stroke="#6ee7b7" stroke-opacity=".28"/>
      <text x="376" y="243" text-anchor="middle" fill="#9ae6c4">ROBOTICS</text>
    </g>
    <g transform="translate(804 45)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 83 175 20 286 84 175 148Z M64 83V184L175 247 286 183V84 M175 148V247" stroke="url(#line)" stroke-width="1.5" opacity=".6"/>
      <path d="M64 184 175 120 286 183 M175 20V120" stroke="#82bcd5" stroke-width="1" opacity=".2" stroke-dasharray="4 7"/>
