        <circle cx="177" cy="74" r="2"/><circle cx="188" cy="92" r="2"/><circle cx="205" cy="85" r="2"/>
        <circle cx="145" cy="104" r="2"/><circle cx="160" cy="114" r="2"/><circle cx="181" cy="105" r="2"/>
        <circle cx="198" cy="119" r="2"/><circle cx="215" cy="109" r="2"/>
        <circle cx="126" cy="117" r="2"/><circle cx="141" cy="128" r="2"/><circle cx="187" cy="135" r="2"/>
