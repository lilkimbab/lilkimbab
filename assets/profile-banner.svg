      <path d="M30 208 93 145 164 175 230 105 318 70" stroke="url(#line)" stroke-width="2.5"/>
      <g stroke="#102130" stroke-width="3">
        <circle cx="30" cy="208" r="5" fill="#7dd3fc"/><circle cx="93" cy="145" r="7" fill="#7dd3fc"/>
        <circle cx="164" cy="175" r="7" fill="#6ee7b7"/><circle cx="230" cy="105" r="7" fill="#6ee7b7"/>
        <circle cx="318" cy="70" r="5" fill="#6ee7b7"/>
      </g>
